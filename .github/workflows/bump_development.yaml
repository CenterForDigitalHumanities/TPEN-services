name: Advance development after a release

# Keeps development one step ahead of main as the standing release candidate.
#
# Triggered by a release to main (a promotion from development). At that moment
# main and development are aligned on the promoted version (see release_main.yaml);
# this then advances development to the next numbered alpha prerelease so it is
# ready as the next release candidate.
#
# Bump magnitude is driven by trigger words in the promotion (merge) commit
# message, defaulting to patch so a minor/major jump is always opt-in:
#   - "BREAKING CHANGE" / "type!:" / "[major]"  -> premajor  (0.1.1-alpha.0 -> 1.0.0-alpha.0)
#   - "feat:" / "feat(scope):" / "[minor]"      -> preminor  (0.1.1-alpha.0 -> 0.2.0-alpha.0)
#   - anything else (default)                   -> prepatch  (0.1.1-alpha.0 -> 0.1.2-alpha.0)
#
# Note: the promoted release itself is whatever development carried into the
# merge (pinned in package.json) — trigger words only steer the NEXT candidate,
# never the version being released by this promotion.
#
# Loop-safe: the bump is pushed to development with the default GITHUB_TOKEN,
# which does not trigger further workflow runs. [skip ci] is belt-and-suspenders.

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advance-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Advance prerelease and push
        env:
          # Pass untrusted commit text through env (never inline into the script).
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LEVEL="prepatch"
          if printf '%s' "$HEAD_COMMIT_MSG" | grep -qiE 'BREAKING CHANGE|\[major\]|(^|[^a-z])[a-z]+(\([^)]*\))?!:'; then
            LEVEL="premajor"
          elif printf '%s' "$HEAD_COMMIT_MSG" | grep -qiE '\[minor\]|(^|[^a-z])feat(\([^)]*\))?:'; then
            LEVEL="preminor"
          fi
          echo "Bump level resolved from commit message: ${LEVEL}"

          npm version "$LEVEL" --preid=alpha --no-git-tag-version
          NEW_VERSION="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json
          git commit -m "ci: advance development prerelease to ${NEW_VERSION} [skip ci]" \
            || { echo "No version change to commit"; exit 0; }
          git push origin development
          echo "development advanced to ${NEW_VERSION}"
